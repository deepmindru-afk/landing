features:
  headline: Услуги
  title: "Закрываем маркетинг и IT целиком."
  description: От аналитики и стратегии до запуска рекламы и технической поддержки. Всё в одной команде — значит, результат не теряется между подрядчиками.
  items:
    - icon: i-lucide-briefcase
      title: B2B-маркетинг
      description: "Разрабатываем стратегии для сложных продуктов и длинных циклов сделки: лидогенерация, квалификация лидов, работа с воронкой продаж."
    - icon: i-lucide-shopping-bag
      title: B2C-продвижение
      description: "Продвигаем товары и услуги конечным потребителям: рекламные кампании, контент, коммуникации и удержание постоянных клиентов."
    - icon: i-lucide-monitor-smartphone
      title: Сайты и веб-разработка
      description: "Сайты, лендинги и интернет-магазины под ключ: проектирование, дизайн, frontend, интеграции с CRM и аналитикой."
    - icon: i-lucide-search
      title: SEO-продвижение
      description: "Техническое и контентное SEO, семантика, работа с мета-тегами и наращивание органического трафика из поисковых систем."
    - icon: i-lucide-megaphone
      title: Реклама и трафик
      description: "Настройка и ведение контекстной, таргетированной и медийной рекламы с контролем бюджета и прозрачной отчётностью по каждому каналу."
    - icon: i-lucide-bar-chart-3
      title: Аналитика и CRM
      description: "Сквозная аналитика, настройка CRM и автоматизация процессов, чтобы вы видели реальную картину по маркетингу и продажам."
process:
  headline: Как мы работаем
  title: "От первого звонка до измеримого результата."
  description: "Прозрачный процесс: вы всегда понимаете, что происходит с проектом, сколько это стоит и какого результата ждать.
  items:
    - index: "01"
      title: Аудит и погружение
      description: "Изучаем ваш бизнес, продукт, рынок и текущие каналы. Считаем исходные метрики, чтобы оценивать эффект честно."
    - index: "02"
      title: Стратегия и план
      description: "Формируем маркетинговую стратегию, приоритеты и план работ с понятными сроками, бюджетом и ожидаемым результатом."
    - index: "03"
      title: Запуск и реализация
      description: "Запускаем каналы, разрабатываем сайты и креативы, настраиваем аналитику. Показываем прогресс по ходу работ."
    - index: "04"
      title: Отчётность и рост
      description: "Регулярно отчитываемся по метрикам, проверяем гипотезы и масштабируем то, что приносит деньги."
about:
  headline: О компании
  title: "Надёжный партнёр, а не разовый исполнитель."
  description: "Фэл икс оказывает услуги для бизнеса. Любому руководителю — будь то промышленное предприятие или услуги для малого бизнеса — важно найти надёжного поставщика и чтобы не было задержек в работе. Понимая уровень ответственности в таком партнёрстве, мы стараемся выполнять договорённости качественно и в срок — нас мотивирует возможность постоянного сотрудничества.
  items:
    - icon: i-lucide-handshake
      title: Постоянное сотрудничество
      description: "Мы заинтересованы в долгосрочной работе, поэтому делаем акцент на регулярном развитии вашего бизнеса, а не на разовых продажах."
    - icon: i-lucide-calendar-check
      title: Соблюдение сроков
      description: "Выполняем договорённости качественно и в срок, чтобы работа в вашем проекте не останавливалась из-за наших задержек."
    - icon: i-lucide-file-text
      title: Качественный анализ
      description: "Опираемся на данные: считаем метрики, проверяем гипотезы и показываем реальную картину по каждому каналу."
    - icon: i-lucide-badge-check
      title: Детальная информация об услугах
      description: "Получить подробную информацию по ассортименту и услугам вы можете у менеджеров Фэл икс — расскажем и покажем, что подойдёт именно вам."
